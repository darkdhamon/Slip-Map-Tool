name: Validate project workflow

on:
  pull_request:
    paths:
      - .github/workflows/complete-dev-merge-project-item.yml
      - .github/workflows/tests/complete-dev-merge-project-item.test.cjs

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run workflow unit tests
        run: node --test .github/workflows/tests/complete-dev-merge-project-item.test.cjs
